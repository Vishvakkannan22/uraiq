<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#A855F7" />
    <title>UraiQ Offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #efe9ff 0%, #e9f6ff 45%, #fff5fb 100%);
        color: #1e1157;
      }
      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(100%, 360px);
        border-radius: 30px;
        padding: 28px;
        background: rgba(255,255,255,.86);
        box-shadow: 0 24px 70px rgba(51, 36, 107, .18), inset 0 0 0 1px rgba(126, 34, 206, .10);
      }
      .mark {
        display: grid;
        place-items: center;
        width: 58px;
        height: 58px;
        border-radius: 18px;
        background: linear-gradient(135deg, #e9b6ff, #a855f7 48%, #6d28d9);
        color: white;
        font-weight: 800;
        font-size: 24px;
        margin-bottom: 22px;
      }
      h1 {
        margin: 0;
        font-size: 1.55rem;
        line-height: 1.15;
      }
      p {
        margin: 12px 0 0;
        color: #6b5f98;
        line-height: 1.5;
      }
      button {
        margin-top: 22px;
        width: 100%;
        height: 48px;
        border: 0;
        border-radius: 999px;
        background: linear-gradient(135deg, #e9b6ff, #a855f7 48%, #6d28d9);
        color: white;
        font: inherit;
        font-weight: 750;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">UQ</div>
      <h1>You are offline</h1>
      <p>UraiQ is installed, but this screen needs a connection before live chats can sync again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
